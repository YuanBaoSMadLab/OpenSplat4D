[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll

; --- Core plugin extras ---
/Scripts/...
/Content/...
; Prebuilt CUDA extensions live in a dedicated, lightweight folder OUTSIDE
; ThirdParty so the end user can update just this small folder (without
; re-copying the heavy ThirdParty/Python). See build_ext.bat / build_plugin.bat.
/Extensions/...
/README.md
/README-zh.md
/LICENSE

; --- Bundled external dependencies (plugin is self-contained after build) ---
; These let the pipeline work out-of-the-box: the editor resolves them via
;   UOpenSplat4DSettings::GetColmapExecutablePath / Get3DGSRepoDir / Get4DGSRepoDir
; (user-specified paths in Project Settings still take priority over these).
;   /ThirdParty/Colmap/                -> colmap.exe + dlls (Windows build)
;   /ThirdParty/gaussian-splatting/    -> Inria 3DGS training repo
;   /ThirdParty/4d-gaussian-splatting/ -> 4DGS training repo (CUDA operators source)
;   /ThirdParty/Python/                -> training env spec / requirements / docs
; NOTE: if any of these were copied as full git clones, their ".git" history is
; also bundled by "...". To slim the package, delete the .git dirs before build
; (the training scripts do not need them at runtime).
/ThirdParty/Colmap/...
/ThirdParty/gaussian-splatting/...
/ThirdParty/4d-gaussian-splatting/...
/ThirdParty/Python/...
