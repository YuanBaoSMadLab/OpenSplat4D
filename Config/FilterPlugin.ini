[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
; Lines prefixed with '-' are exclusion rules and win over earlier includes.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll

; --- Core plugin extras ---
; (/Content/..., /Source/..., /Shaders/..., /Resources/... and the built binaries are
;  included by BuildPlugin itself; they are kept here so the intent is explicit.)
/Content/...
/README.md
/README-zh.md
/LICENSE
/THIRD-PARTY-LICENSES.md

; --- Deliberately NOT packaged ---
; The optional training pipeline is not shipped with the plugin: no Python runtime,
; no COLMAP, no training repository. End users point
;   UOpenSplat4DSettings::GetPythonExecutablePath / GetColmapExecutablePath /
;   Get3DGSRepoDir / Get4DGSRepoDir
; at their own installs (Project Settings > OpenSplat4D). Rendering, importing and
; playing back splat assets do not use any of it.
;   /ThirdParty/Python/                -> Python 3.10 environment (not shipped)
;   /ThirdParty/Colmap/                -> COLMAP Windows build (not shipped)
;   /ThirdParty/gaussian-splatting/    -> Inria 3DGS training repo (not shipped)
;   /ThirdParty/4d-gaussian-splatting/ -> 4DGS training repo (not shipped)
; (No include rule is listed for /ThirdParty/..., so the folder is left out entirely.)

; Local self-builds of the training CUDA extensions land in
; Content/Python/Lib/site-packages/. They are non-commercial (Inria/MPII) and must
; never be published, so they are excluded from the package even though /Content/...
; would otherwise pick them up.
-/Content/Python/Lib/site-packages/diff_gaussian_rasterization/...
-/Content/Python/Lib/site-packages/simple_knn/...
-/Content/Python/Lib/site-packages/fused_ssim/...
-/Content/Python/Lib/site-packages/*.pyd

; Local IDE project files for the helper script: editor-generated, machine local,
; not part of the plugin. (Fab: the plugin folder must not contain local files.)
-/Content/Python/OpenSplat4D/*.sln
-/Content/Python/OpenSplat4D/*.pyproj
